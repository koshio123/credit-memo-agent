services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit_memo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_memo}
      POSTGRES_DB: ${POSTGRES_DB:-credit_memo}
    ports:
      # 手元のPostgreSQL（5432）と衝突しないよう、ホスト側は5433にする
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
